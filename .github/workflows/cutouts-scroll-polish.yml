name: Cutouts and scroll polish

on:
  push:
    branches: [codex/cutouts-scroll-polish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutouts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/cutouts-scroll-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development checks
        run: |
          python -m pip install -r scripts/requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Render and validate site
        run: |
          python scripts/render.py
          python scripts/validate.py
          for file in dist/assets/*.js; do node --check "$file"; done
          node scripts/check-interactions.cjs
          node scripts/check-pau-api.cjs
          node scripts/check-pau-ui.cjs
          node scripts/check-inquiry.cjs
          node scripts/check-motion.cjs
          python scripts/check-browser.py work/browser-qa
          python scripts/check-motion-browser.py
          git diff --check
      - name: Save browser review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-motion-review
          path: |
            docs/review/cutouts-scroll
            work/browser-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified screenshots to the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/cutouts-scroll-polish"
          python - <<'PY'
          from pathlib import Path
          import re
          review = Path("docs/review/cutouts-scroll")
          shots = sorted(
              p for p in review.iterdir()
              if p.is_file() and not p.is_symlink()
              and re.fullmatch(r"motion-[a-z0-9-]+\.(?:jpg|jpeg|png)", p.name)
          )
          if len(shots) < 2:
              raise ValueError("Missing desktop/mobile review screenshots")
          Path("work").mkdir(exist_ok=True)
          Path("work/review-paths.z").write_bytes(
              b"".join(p.as_posix().encode("utf-8") + b"\0" for p in shots)
          )
          PY
          git add --pathspec-from-file=work/review-paths.z --pathspec-file-nul
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record verified desktop and mobile motion previews"
          cat > "$RUNNER_TEMP/cutout-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/cutout-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/cutout-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= push origin \
            HEAD:refs/heads/codex/cutouts-scroll-polish
