name: Prepare premium scroll and emoji review
on:
  push:
    branches: [codex/premium-scroll-emoji]
    paths: [src/index.html, dist/assets/premium.css, dist/assets/premium-motion.js, dist/assets/pau-assistant.js, scripts/export-assistant-emoji.py, scripts/check-premium-browser.py, scripts/validate.py, scripts/check-pau-ui.cjs, .github/workflows/prepare-premium.yml, source-assets/assistant/pau-emoji-sheet.png]
concurrency:
  group: premium-preparation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/requirements-qa.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/export-assistant-emoji.py
      - run: python scripts/render.py
      - run: python scripts/validate.py
      - run: node scripts/check-pau-ui.cjs
      - run: python scripts/check-premium-browser.py
      - name: Save rendered page, emoji frames and browser review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html dist/assets/pau-emoji-*.webp docs/review/premium
          git commit -m "Render premium scroll experience and export animated emoji frames"
          git push origin HEAD:codex/premium-scroll-emoji
