name: Responsive site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development checks
        run: |
          python -m pip install -r scripts/requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Render and validate site
        run: |
          python scripts/export-assistant-emoji.py
          python scripts/render.py
          python scripts/validate.py
          for file in dist/assets/*.js; do node --check "$file"; done
          node scripts/check-interactions.cjs
          node scripts/check-pau-api.cjs
          node scripts/check-pau-ui.cjs
          node scripts/check-inquiry.cjs
          python scripts/check-browser.py
          python scripts/check-assistant-browser.py
          python scripts/check-premium-browser.py
          python scripts/check-motion-browser.py
          git diff --check
      - name: Save responsive browser review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-motion-review
          path: |
            docs/review/responsive-motion
            docs/review/assistant
            docs/review/premium
          if-no-files-found: warn
          retention-days: 7
