name: Prepare assistant review
on:
  push:
    branches: [codex/assistant-icon-dropdown]
    paths: [src/index.html, dist/assets/pau-assistant.css, dist/assets/pau-assistant.js, dist/assets/pau-assistant-icon.svg, scripts/check-assistant-browser.py, scripts/validate.py, .github/workflows/prepare-assistant.yml]
concurrency:
  group: assistant-preparation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/requirements-qa.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/render.py
      - run: python scripts/validate.py
      - run: node scripts/check-pau-ui.cjs
      - run: python scripts/check-assistant-browser.py
      - name: Record generated page and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html docs/review/assistant
          git commit -m "Render compact assistant and capture browser review"
          git push origin HEAD:codex/assistant-icon-dropdown
