name: Prepare hero edge review
on:
  push:
    branches: [codex/hero-edge-refinement]
    paths: [scripts/cutouts/refine-hero-edge.py, .github/workflows/prepare-hero-edge.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow numpy scipy
      - run: python scripts/cutouts/refine-hero-edge.py
      - name: Record review candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/photos/pau-hero-cut* docs/review/hero-edge
          git commit -m "Refine hero edge transparency without changing photographic RGB"
          git push origin HEAD:codex/hero-edge-refinement
